services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ktr3_underground
      POSTGRES_USER: ktr3
      POSTGRES_PASSWORD: ktr3_local_only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - ktr3_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ktr3 -d ktr3_underground"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  ktr3_postgres_data:
