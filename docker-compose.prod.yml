services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ktr3_underground}
      POSTGRES_USER: ${POSTGRES_USER:-ktr3}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ktr3} -d ${POSTGRES_DB:-ktr3_underground}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ktr3-links:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:?NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN is required}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://eu.i.posthog.com}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN:-https://ktr3.es,https://www.ktr3.es}
      DATABASE_URL: postgres://${POSTGRES_USER:-ktr3}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@database:5432/${POSTGRES_DB:-ktr3_underground}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-5}
      RESOURCE_STORAGE_DRIVER: ${RESOURCE_STORAGE_DRIVER:-local}
      RESOURCE_STORAGE_PATH: /data/resources
      RESOURCE_MAX_UPLOAD_BYTES: ${RESOURCE_MAX_UPLOAD_BYTES:-262144000}
      ADMIN_RATE_LIMIT_SECRET: ${ADMIN_RATE_LIMIT_SECRET:?ADMIN_RATE_LIMIT_SECRET is required}
      RESOURCE_RATE_LIMIT_SECRET: ${RESOURCE_RATE_LIMIT_SECRET:?RESOURCE_RATE_LIMIT_SECRET is required}
      RESOURCE_EMAIL_LIMIT_PER_HOUR: ${RESOURCE_EMAIL_LIMIT_PER_HOUR:-5}
      RESOURCE_IP_LIMIT_PER_HOUR: ${RESOURCE_IP_LIMIT_PER_HOUR:-10}
      RESOURCE_IP_LIMIT_PER_DAY: ${RESOURCE_IP_LIMIT_PER_DAY:-30}
      RESOURCE_GLOBAL_LIMIT_PER_DAY: ${RESOURCE_GLOBAL_LIMIT_PER_DAY:-90}
      TURNSTILE_ENFORCE: ${TURNSTILE_ENFORCE:-true}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?TURNSTILE_SECRET_KEY is required}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:?NEXT_PUBLIC_TURNSTILE_SITE_KEY is required}
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:?NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN is required}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://eu.i.posthog.com}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-development}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_CONTACTS_API_KEY: ${RESEND_CONTACTS_API_KEY:-}
      RESEND_SEGMENT_ID: ${RESEND_SEGMENT_ID:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      PUBLIC_LEGAL_NAME: ${PUBLIC_LEGAL_NAME:?PUBLIC_LEGAL_NAME is required}
      PUBLIC_LEGAL_TAX_ID: ${PUBLIC_LEGAL_TAX_ID:?PUBLIC_LEGAL_TAX_ID is required}
      PUBLIC_LEGAL_ADDRESS: ${PUBLIC_LEGAL_ADDRESS:?PUBLIC_LEGAL_ADDRESS is required}
      PUBLIC_LEGAL_EMAIL: ${PUBLIC_LEGAL_EMAIL:?PUBLIC_LEGAL_EMAIL is required}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-ktr3-resources}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LOCAL_HTTP_PORT:-3300}:3000"
    volumes:
      - resources_data:/data/resources
    labels:
      - traefik.enable=${TRAEFIK_ENABLE:-true}
      - traefik.http.routers.ktr3links.rule=Host(`ktr3.es`)
      - traefik.http.routers.ktr3links.entrypoints=websecure
      - traefik.http.routers.ktr3links.tls.certresolver=letsencrypt
      - traefik.http.services.ktr3links.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - backend
      - easypanel
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  database_data:
  resources_data:

networks:
  backend:
    internal: true
  easypanel:
    external: true
